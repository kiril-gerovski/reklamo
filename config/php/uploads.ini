; Deliberately RESTRICTIVE — mimics Bulgarian shared hosting (SuperHosting / Jump.bg).
; If chunked upload works under these limits, it works in production.
; Do not raise these to "make a test pass"; that hides the exact bug we engineer against.
upload_max_filesize = 64M
post_max_size = 64M
max_input_time = 60
max_execution_time = 60
memory_limit = 256M
file_uploads = On

; Dev ergonomics
display_errors = Off
log_errors = On
error_log = /var/www/html/wp-content/php-errors.log
